# SPDX-License-Identifier: AGPL-3.0-or-later
# Unit tests on every push and pull request, then the lab test: the real image, two bros in Docker,
# pairing, an address change and unpairing (tests/lab/e2e.py).
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:          # build.yml runs this before it publishes an image

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"     # same as the image (python:3.13-alpine)
      - name: Install
        run: pip install -r app/requirements.txt ruff
      - name: Lint
        run: ruff check --select F,E9 app tests
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -t tests/unit -v

  lab:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and start the lab
        shell: pwsh
        working-directory: lab
        run: ./lab.ps1 -SizeMB 40
      - name: End-to-end test
        run: python3 tests/lab/e2e.py
      - name: Logs
        if: failure()
        working-directory: lab
        run: docker compose logs --no-color > lab-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lab-logs
          path: lab/lab-logs.txt
          retention-days: 7

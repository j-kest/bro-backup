{% extends "base.html" %}
{% block content %}
<h1>BRO Backup</h1>
<section style="max-width:380px">
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Password<input type="password" name="pw" required autofocus autocomplete="current-password"></label>
    {% if two_step %}<label>Code from your authenticator app<input type="text" name="code" required inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" autocomplete="one-time-code"></label>{% endif %}
    <p><button>Log in</button></p>
  </form>
</section>
{% endblock %}
